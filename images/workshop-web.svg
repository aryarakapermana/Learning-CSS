<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d3557"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bgCode)" rx="16"/>
  <!-- Decorative grid lines -->
  <line x1="50" y1="0" x2="50" y2="360" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  <line x1="150" y1="0" x2="150" y2="360" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  <line x1="250" y1="0" x2="250" y2="360" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  <line x1="350" y1="0" x2="350" y2="360" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  <line x1="450" y1="0" x2="450" y2="360" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  <line x1="550" y1="0" x2="550" y2="360" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>

  <!-- Code editor mockup -->
  <g transform="translate(100, 45)">
    <rect width="400" height="260" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" opacity="0.95"/>
    <!-- Window controls -->
    <rect width="400" height="32" rx="12" fill="#0f172a"/>
    <rect width="400" height="16" y="16" fill="#0f172a"/>
    <circle cx="20" cy="16" r="5" fill="#ef4444"/>
    <circle cx="36" cy="16" r="5" fill="#eab308"/>
    <circle cx="52" cy="16" r="5" fill="#22c55e"/>
    <text x="200" y="21" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">style.css &amp; index.html</text>

    <!-- Code elements -->
    <text x="30" y="70" fill="#f43f5e" font-family="monospace" font-size="14">&lt;header&gt;</text>
    <text x="50" y="95" fill="#38bdf8" font-family="monospace" font-size="14">&lt;h1&gt;<tspan fill="#ffffff">Campus Life</tspan>&lt;/h1&gt;</text>
    <text x="30" y="120" fill="#f43f5e" font-family="monospace" font-size="14">&lt;/header&gt;</text>
    
    <text x="30" y="155" fill="#a855f7" font-family="monospace" font-size="14">.card <tspan fill="#e2e8f0">{</tspan></text>
    <text x="50" y="180" fill="#38bdf8" font-family="monospace" font-size="13">background: <tspan fill="#34d399">#ffffff</tspan>;</text>
    <text x="50" y="200" fill="#38bdf8" font-family="monospace" font-size="13">border-radius: <tspan fill="#fbbf24">12px</tspan>;</text>
    <text x="50" y="220" fill="#38bdf8" font-family="monospace" font-size="13">box-shadow: <tspan fill="#f43f5e">0 8px 24px rgba(0,0,0,0.1)</tspan>;</text>
    <text x="30" y="242" fill="#e2e8f0" font-family="monospace" font-size="14">}</text>

    <!-- HTML / CSS Badges -->
    <rect x="250" y="60" width="125" height="42" rx="8" fill="#e44d26" opacity="0.9"/>
    <text x="312" y="87" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="15" text-anchor="middle">&lt;HTML5 /&gt;</text>

    <rect x="250" y="115" width="125" height="42" rx="8" fill="#2563eb" opacity="0.9"/>
    <text x="312" y="142" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="15" text-anchor="middle">{ CSS3 }</text>
  </g>
</svg>
