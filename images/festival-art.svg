<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgArt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="50%" stop-color="#be185d"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bgArt)" rx="16"/>
  <!-- Floating musical / festive shapes -->
  <circle cx="100" cy="90" r="40" fill="#fbcfe8" opacity="0.25"/>
  <circle cx="500" cy="120" r="50" fill="#fed7aa" opacity="0.3"/>
  <circle cx="480" cy="270" r="35" fill="#f472b6" opacity="0.2"/>

  <!-- Musical Notes & Spotlight -->
  <g fill="#ffffff" opacity="0.9">
    <!-- Music note 1 -->
    <path d="M160 180 A 15 15 0 1 1 145 195 V 135 H 180 V 150 H 160 Z"/>
    <!-- Palette icon in center -->
    <circle cx="300" cy="165" r="65" fill="#ffffff"/>
    <circle cx="275" cy="145" r="9" fill="#ef4444"/>
    <circle cx="305" cy="135" r="9" fill="#f59e0b"/>
    <circle cx="330" cy="150" r="9" fill="#10b981"/>
    <circle cx="330" cy="180" r="9" fill="#3b82f6"/>
    <circle cx="275" cy="185" r="12" fill="#be185d"/>
    <!-- Brush -->
    <path d="M380 90 L400 110 L340 170 L320 150 Z" fill="#fef08a"/>
    <polygon points="320,150 340,170 310,185" fill="#ca8a04"/>
  </g>

  <text x="300" y="275" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="22" text-anchor="middle">Festival Budaya &amp; Kreativitas Kampus</text>
  <text x="300" y="305" fill="#fce7f3" font-family="sans-serif" font-size="14" text-anchor="middle">Ekspresikan Bakat Seni, Musik, &amp; Tari Mahasiswa</text>
</svg>
